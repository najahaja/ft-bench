[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftbench"
version = "0.1.0"
description = "Open-Weight LLM Fine-Tuning and Optimized Serving Benchmark"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ftbench*", "serving*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
